<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
  </head>
  <body class="h-screen flex items-center justify-center">
    <div class="flex flex-col gap-4">
      <div id="me" class="bg-blue-500 flex items-center justify-center w-60 h-60">Hello</div>
      <button onclick="gp(10)" class="bg-black text-white px-8 py-2 rounded-sm">Timer</button>
    </div>
    <script>
        // let count=10;
        function gp(num) {
                 let elem =  document.getElementById("me");
                 let interval = setInterval(() => {
                  elem.innerText=num;
                  num-=1;
                  if (num==0) {
                    clearInterval(interval);
                  }
                  // gp(num);
                 }, 1000);
        }
        
    </script>
  </body>
</html>
